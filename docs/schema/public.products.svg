<text text-anchor="start" x="110.12" y="-1260.6" font-family="Arial" font-size="14.00"> service | product | gift_card | tip | discount | late_cancellation_fee. kind=service carries appointment + staff attribution; kind=tip carries staff attribution for payroll reads; kind=discount is negative; kind=gift_card is a liability sale, excluded from revenue reporting; kind=late_cancellation_fee is a POSITIVE line for the $50 fee charged to a card on file under the cancellation policy, with appointment attribution and no tax — revenue, but not service or retail revenue, so it stays out of the &quot;services + retail&quot; reporting sums by kind.</text>
