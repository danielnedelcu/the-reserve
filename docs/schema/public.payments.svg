<text text-anchor="start" x="1187.44" y="-719.6" font-family="Arial" font-size="14.00"> Set on method=stripe_card rows (pi_...). The refund route calls stripe.refunds.create against this. The sync charge flow guarantees it: ledger rows are written only after the PaymentIntent succeeds.</text>
