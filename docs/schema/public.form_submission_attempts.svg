<text text-anchor="start" x="2316.64" y="-577.2" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="1026.33" y="-562.8" font-family="Arial" font-size="14.00" fill="#333333">Rate&#45;limit state for the public submission endpoint, IN THE DATABASE rather than process memory: in&#45;memory counters stop limiting the moment there is a second instance, and a security control that fails green is worse than none. organization_id and token are nullable because an attempt with an unrecognised token belongs to no org and names no real link — recording it is the point.</text>
