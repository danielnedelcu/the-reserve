<text text-anchor="start" x="53.2" y="-442.4" font-family="Arial" font-size="14.00">ip_hash </text>
<text text-anchor="start" x="106.13" y="-442.4" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="136.48" y="-442.4" font-family="Arial" font-size="14.00"> HMAC&#45;SHA256 of the client IP under a server&#45;only secret (FORM_IP_PEPPER), never a plain hash: the IPv4 space is 4 billion values, so an unsalted digest is precomputable and therefore plaintext&#45;equivalent — unacceptable for visitor records on a health&#45;intake page. The keyed hash keeps the only property rate limiting needs, that the same IP yields the same value inside this system, without being reversible by anyone who obtains the table. Rows are still purged by the 30&#45;day sweep. If the secret is absent the submission route REFUSES to serve rather than falling back to a weaker hash: a security control that silently degrades is the failure mode this project names by convention.</text>
