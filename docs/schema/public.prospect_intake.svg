<text text-anchor="start" x="124.79" y="-473.2" font-family="Arial" font-size="14.00"> submitted &#45;&gt; under_review &#45;&gt; approved. approved creates NOTHING usable: enrollment (tier + card on file) is the gate to clienthood and is owner&#45;blocked on §3. Transitions and the review UI land in phase 3; this column exists so a submission has somewhere to start.</text>
