<text text-anchor="start" x="1226.04" y="-700.4" font-family="Arial Bold" font-size="18.00">public.prospect_intake</text>
<text text-anchor="start" x="1389.49" y="-700.4" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1420.6" y="-700.4" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="53.2" y="-686" font-family="Arial" font-size="14.00" fill="#333333">A person who has submitted an intake form and is not yet a client. TEMPORARY CUSTODY: contact details live here in transit and are purged at 30 days if the prospect never enrols (phase 3 sweep). Deliberately NOT a clients row with status=prospect — clients are members in this business, and status&#45;flagging would force every existing clients query and policy to start filtering. Mirrors staff_invites being separate from staff.</text>
