<text text-anchor="start" x="1226.03" y="-1210.6" font-family="Arial Bold" font-size="18.00">public.form_responses</text>
<text text-anchor="start" x="1389.5" y="-1210.6" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1420.61" y="-1210.6" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="97.13" y="-1196.2" font-family="Arial" font-size="14.00" fill="#333333">One filled&#45;in form. answers holds ONLY the non&#45;sensitive answers; anything the version marks sensitive is in form_response_health, behind clients.notes.health.view. No authenticated INSERT policy exists on purpose: a submission must be validated against its version&#39;s field list, Postgres cannot check jsonb shape, so writes go through a server route under the service role and the validator is the enforcement.</text>
<polygon fill="none" stroke="black" points="90.13,-1156 90.13,-1186.8 2649.89,-1186.8 2649.89,-1156 90.13,-1156"/>
<text text-anchor="start" x="97.13" y="-1168.2" font-family="Arial" font-size="14.00">id </text>
<text text-anchor="start" x="111.91" y="-1168.2" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="90.13,-1125.2 90.13,-1156 2649.89,-1156 2649.89,-1125.2 90.13,-1125.2"/>
<text text-anchor="start" x="97.13" y="-1137.4" font-family="Arial" font-size="14.00">organization_id </text>
<text text-anchor="start" x="195.98" y="-1137.4" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="90.13,-1094.4 90.13,-1125.2 2649.89,-1125.2 2649.89,-1094.4 90.13,-1094.4"/>
<text text-anchor="start" x="97.13" y="-1106.6" font-family="Arial" font-size="14.00">form_version_id </text>
<text text-anchor="start" x="200.62" y="-1106.6" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="90.13,-1063.6 90.13,-1094.4 2649.89,-1094.4 2649.89,-1063.6 90.13,-1063.6"/>
<text text-anchor="start" x="97.13" y="-1075.8" font-family="Arial" font-size="14.00">client_id </text>
<text text-anchor="start" x="152.38" y="-1075.8" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="186.63" y="-1075.8" font-family="Arial" font-size="14.00"> The subject, when an existing client fills a waiver. Nullable because phase 2 adds prospect_intake_id for people who have no client record yet, and widens form_responses_subject to &quot;exactly one subject&quot;. Until then the check requires a client.</text>
<polygon fill="none" stroke="black" points="90.13,-1032.8 90.13,-1063.6 2649.89,-1063.6 2649.89,-1032.8 90.13,-1032.8"/>
<text text-anchor="start" x="97.13" y="-1045" font-family="Arial" font-size="14.00">answers </text>
<text text-anchor="start" x="153.15" y="-1045" font-family="Arial" font-size="14.00" fill="#666666">[jsonb]</text>
<polygon fill="none" stroke="black" points="90.13,-1002 90.13,-1032.8 2649.89,-1032.8 2649.89,-1002 90.13,-1002"/>
<text text-anchor="start" x="97.13" y="-1014.2" font-family="Arial" font-size="14.00">consent_text </text>
<text text-anchor="start" x="180.4" y="-1014.2" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="210.75" y="-1014.2" font-family="Arial" font-size="14.00"> Physical snapshot of the consent copy this person actually agreed to, readable without joining the version. Same discipline as the card&#45;consent policy_text snapshot: the legal record must not depend on a lookup years later.</text>
<polygon fill="none" stroke="black" points="90.13,-971.2 90.13,-1002 2649.89,-1002 2649.89,-971.2 90.13,-971.2"/>
<text text-anchor="start" x="97.13" y="-983.4" font-family="Arial" font-size="14.00">consented_at </text>
<text text-anchor="start" x="185.09" y="-983.4" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<polygon fill="none" stroke="black" points="90.13,-940.4 90.13,-971.2 2649.89,-971.2 2649.89,-940.4 90.13,-940.4"/>
<text text-anchor="start" x="97.13" y="-952.6" font-family="Arial" font-size="14.00">submitted_at </text>
<text text-anchor="start" x="181.18" y="-952.6" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<polygon fill="none" stroke="black" points="90.13,-909.6 90.13,-940.4 2649.89,-940.4 2649.89,-909.6 90.13,-909.6"/>
<text text-anchor="start" x="97.13" y="-921.8" font-family="Arial" font-size="14.00">created_at </text>
<text text-anchor="start" x="167.18" y="-921.8" font-family="Arial" font-size="14.00" fill="#666666">[timestamp with time zone]</text>
<polygon fill="none" stroke="black" points="90.13,-878.8 90.13,-909.6 2649.89,-909.6 2649.89,-878.8 90.13,-878.8"/>
<text text-anchor="start" x="97.13" y="-891" font-family="Arial" font-size="14.00">prospect_intake_id </text>
<text text-anchor="start" x="218.54" y="-891" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="252.79" y="-891" font-family="Arial" font-size="14.00"> The subject when the person had no client record. Cascades: purging a prospect takes their answers with them, which is what the 30&#45;day retention promise means.</text>
<polygon fill="none" stroke="black" points="90.13,-848 90.13,-878.8 2649.89,-878.8 2649.89,-848 90.13,-848"/>
<text text-anchor="start" x="97.13" y="-860.2" font-family="Arial" font-size="14.00">form_link_id </text>
<text text-anchor="start" x="176.49" y="-860.2" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="210.74" y="-860.2" font-family="Arial" font-size="14.00"> Which issued link produced this response. Audit trail, not authorization — the link is consumed by then. Nulls on delete so a tidied link cannot orphan a response.</text>
</g>
