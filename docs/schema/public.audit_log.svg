<text text-anchor="start" x="267.06" y="-1148" font-family="Arial" font-size="14.00" fill="#333333">Who did what, to which record, when — one row per sensitive action. Append&#45;only for EVERY role, the service role included (trg_audit_log_append_only; the API roles also lack update and delete). Scoped to the organisation by organization_id, set by every writer from a row it holds.</text>
