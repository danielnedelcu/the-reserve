<text text-anchor="start" x="2251.49" y="-977.6" font-family="Arial Bold" font-size="18.00">public.cancellation_tokens</text>
<text text-anchor="start" x="2443.93" y="-977.6" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="2475.05" y="-977.6" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="315.44" y="-963.2" font-family="Arial" font-size="14.00" fill="#333333">Single&#45;use tokens for the public cancel&#45;via&#45;link flow. Created at booking, claimed atomically at cancellation. See client&#45;communications&#45;design.md. One per appointment: the confirmation and reminder emails carry /cancel/&lt;id&gt;; expires_at is the appointment start (no cancelling via link once it has begun); used_at is set by the cancel route in the same statement that checks it is null, so two clicks cannot both succeed. Same token&#45;gated shape as the public intake submit: anon holds no policy here, staff never browse tokens, and the route reads and writes under the service role — NO authenticated policies exist, and that absence is the design. Cascades with its appointment.</text>
<polygon fill="none" stroke="black" points="308.44,-923 308.44,-953.8 4511.47,-953.8 4511.47,-923 308.44,-923"/>
