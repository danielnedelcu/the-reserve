<text text-anchor="start" x="128.54" y="-1014.2" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="162.79" y="-1014.2" font-family="Arial" font-size="14.00"> The subject, when an existing client fills a waiver. Nullable because phase 2 adds prospect_intake_id for people who have no client record yet, and widens form_responses_subject to &quot;exactly one subject&quot;. Until then the check requires a client.</text>
<polygon fill="none" stroke="black" points="66.28,-971.2 66.28,-1002 2626.04,-1002 2626.04,-971.2 66.28,-971.2"/>
