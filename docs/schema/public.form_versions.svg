<text text-anchor="start" x="1365.65" y="-1149" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1396.77" y="-1149" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="73.28" y="-1134.6" font-family="Arial" font-size="14.00" fill="#333333">One filled&#45;in form. answers holds ONLY the non&#45;sensitive answers; anything the version marks sensitive is in form_response_health, behind clients.notes.health.view. No authenticated INSERT policy exists on purpose: a submission must be validated against its version&#39;s field list, Postgres cannot check jsonb shape, so writes go through a server route under the service role and the validator is the enforcement.</text>
<polygon fill="none" stroke="black" points="66.28,-1094.4 66.28,-1125.2 2626.04,-1125.2 2626.04,-1094.4 66.28,-1094.4"/>
