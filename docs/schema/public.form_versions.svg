<text text-anchor="start" x="156.56" y="-952.6" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="186.9" y="-952.6" font-family="Arial" font-size="14.00"> Physical snapshot of the consent copy this person actually agreed to, readable without joining the version. Same discipline as the card&#45;consent policy_text snapshot: the legal record must not depend on a lookup years later.</text>
