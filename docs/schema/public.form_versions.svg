<text text-anchor="start" x="167.6" y="-627.2" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="46.2,-584.2 46.2,-615 2646.13,-615 2646.13,-584.2 46.2,-584.2"/>
<text text-anchor="start" x="53.2" y="-596.4" font-family="Arial" font-size="14.00">version </text>
<text text-anchor="start" x="102.22" y="-596.4" font-family="Arial" font-size="14.00" fill="#666666">[integer]</text>
<polygon fill="none" stroke="black" points="46.2,-553.4 46.2,-584.2 2646.13,-584.2 2646.13,-553.4 46.2,-553.4"/>
<text text-anchor="start" x="53.2" y="-565.6" font-family="Arial" font-size="14.00">fields </text>
<text text-anchor="start" x="89.77" y="-565.6" font-family="Arial" font-size="14.00" fill="#666666">[jsonb]</text>
<text text-anchor="start" x="131.02" y="-565.6" font-family="Arial" font-size="14.00"> Ordered array of field descriptors: [{&quot;key&quot;,&quot;label&quot;,&quot;type&quot;,&quot;required&quot;,&quot;sensitive&quot;}]. sensitive=true routes an answer to form_response_health instead of form_responses.answers — it is the switch that decides whether an answer needs clients.notes.health.view to read. Postgres cannot validate this shape; the server route that accepts submissions is the only enforcement, which is why it is the tested one.</text>
<polygon fill="none" stroke="black" points="46.2,-522.6 46.2,-553.4 2646.13,-553.4 2646.13,-522.6 46.2,-522.6"/>
<text text-anchor="start" x="53.2" y="-534.8" font-family="Arial" font-size="14.00">consent_text </text>
<text text-anchor="start" x="136.48" y="-534.8" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="166.82" y="-534.8" font-family="Arial" font-size="14.00"> The waiver/consent copy shown with THIS version. Copied onto each response at submit (form_responses.consent_text) — the reference here is provenance; the copy there is the legal record.</text>
<polygon fill="none" stroke="black" points="46.2,-491.8 46.2,-522.6 2646.13,-522.6 2646.13,-491.8 46.2,-491.8"/>
