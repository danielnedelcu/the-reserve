<text text-anchor="start" x="1360.66" y="-700.4" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1391.77" y="-700.4" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="53.2" y="-686" font-family="Arial" font-size="14.00" fill="#333333">One immutable published shape of a form. APPEND&#45;ONLY BY DESIGN: no update or delete policy exists, so Postgres denies both, and the revoke below states that intent out loud. Editing a form means inserting a new version. That immutability is what lets a response REFERENCE the shape it answered instead of copying it — change a version in place and every response that points at it silently changes meaning.</text>
<polygon fill="none" stroke="black" points="46.2,-645.8 46.2,-676.6 2646.13,-676.6 2646.13,-645.8 46.2,-645.8"/>
