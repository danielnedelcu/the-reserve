<text text-anchor="start" x="2262.81" y="-1024.8" font-family="Arial" font-size="14.00" fill="#666666">[VIEW]</text>
<text text-anchor="start" x="53.2" y="-1010.4" font-family="Arial" font-size="14.00" fill="#333333">THE revenue definition, one row per transaction line (docs/design/server&#45;tables&#45;design.md decision 2; docs/design/ask&#45;the&#45;reserve&#45;design.md). revenue_cents = service + product lines, pre&#45;tax, gross of discounts, net of refunds (mirror lines are negative; never filter by sign). tips_cents, fees_cents (late cancellation), gift_cards_sold_cents (a liability, never revenue) and discount_cents are their own figures; tax is tax_cents per line. local_day / local_week (Sunday start) / local_month are the transaction&#39;s own location&#39;s calendar. SECURITY INVOKER: the ledger&#39;s RLS applies as the caller. transactions_page, the dashboard and Ask all sum these columns; nothing classifies kinds elsewhere.</text>
