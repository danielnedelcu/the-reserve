<text text-anchor="start" x="1204.18" y="-1025.8" font-family="Arial Bold" font-size="18.00">public.form_versions</text>
<text text-anchor="start" x="1357.66" y="-1025.8" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1388.77" y="-1025.8" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="50.2" y="-1011.4" font-family="Arial" font-size="14.00" fill="#333333">One immutable published shape of a form. APPEND&#45;ONLY BY DESIGN: no update or delete policy exists, so Postgres denies both, and the revoke below states that intent out loud. Editing a form means inserting a new version. That immutability is what lets a response REFERENCE the shape it answered instead of copying it — change a version in place and every response that points at it silently changes meaning.</text>
<polygon fill="none" stroke="black" points="43.2,-971.2 43.2,-1002 2643.13,-1002 2643.13,-971.2 43.2,-971.2"/>
<text text-anchor="start" x="50.2" y="-983.4" font-family="Arial" font-size="14.00">id </text>
<text text-anchor="start" x="64.99" y="-983.4" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="43.2,-940.4 43.2,-971.2 2643.13,-971.2 2643.13,-940.4 43.2,-940.4"/>
<text text-anchor="start" x="50.2" y="-952.6" font-family="Arial" font-size="14.00">form_definition_id </text>
<text text-anchor="start" x="164.6" y="-952.6" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<polygon fill="none" stroke="black" points="43.2,-909.6 43.2,-940.4 2643.13,-940.4 2643.13,-909.6 43.2,-909.6"/>
<text text-anchor="start" x="50.2" y="-921.8" font-family="Arial" font-size="14.00">version </text>
<text text-anchor="start" x="99.22" y="-921.8" font-family="Arial" font-size="14.00" fill="#666666">[integer]</text>
<polygon fill="none" stroke="black" points="43.2,-878.8 43.2,-909.6 2643.13,-909.6 2643.13,-878.8 43.2,-878.8"/>
<text text-anchor="start" x="50.2" y="-891" font-family="Arial" font-size="14.00">fields </text>
<text text-anchor="start" x="86.77" y="-891" font-family="Arial" font-size="14.00" fill="#666666">[jsonb]</text>
<text text-anchor="start" x="128.02" y="-891" font-family="Arial" font-size="14.00"> Ordered array of field descriptors: [{&quot;key&quot;,&quot;label&quot;,&quot;type&quot;,&quot;required&quot;,&quot;sensitive&quot;}]. sensitive=true routes an answer to form_response_health instead of form_responses.answers — it is the switch that decides whether an answer needs clients.notes.health.view to read. Postgres cannot validate this shape; the server route that accepts submissions is the only enforcement, which is why it is the tested one.</text>
<polygon fill="none" stroke="black" points="43.2,-848 43.2,-878.8 2643.13,-878.8 2643.13,-848 43.2,-848"/>
<text text-anchor="start" x="50.2" y="-860.2" font-family="Arial" font-size="14.00">consent_text </text>
<text text-anchor="start" x="133.48" y="-860.2" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="163.82" y="-860.2" font-family="Arial" font-size="14.00"> The waiver/consent copy shown with THIS version. Copied onto each response at submit (form_responses.consent_text) — the reference here is provenance; the copy there is the legal record.</text>
<polygon fill="none" stroke="black" points="43.2,-817.2 43.2,-848 2643.13,-848 2643.13,-817.2 43.2,-817.2"/>
<text text-anchor="start" x="50.2" y="-829.4" font-family="Arial" font-size="14.00">published_at </text>
