<text text-anchor="start" x="433.95" y="-624.4" font-family="Arial" font-size="14.00" fill="#333333">A form&#39;s IDENTITY (org + key), separate from its answerable shape, which lives in versioned form_versions rows. One row per form the business asks people to fill: prospect_intake, service_waiver. Deactivated, never deleted — a definition with responses against it must stay resolvable forever.</text>
