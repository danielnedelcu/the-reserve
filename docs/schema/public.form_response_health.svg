<text text-anchor="start" x="308.06" y="-86.2" font-family="Arial" font-size="14.00"> The subject when the person had no client record. Cascades: purging a prospect takes their answers with them, which is what the 30&#45;day retention promise means.</text>
<polygon fill="none" stroke="black" points="145.4,-43.2 145.4,-74 2705.15,-74 2705.15,-43.2 145.4,-43.2"/>
<text text-anchor="start" x="152.4" y="-55.4" font-family="Arial" font-size="14.00">form_link_id </text>
<text text-anchor="start" x="231.76" y="-55.4" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="266.01" y="-55.4" font-family="Arial" font-size="14.00"> Which issued link produced this response. Audit trail, not authorization — the link is consumed by then. Nulls on delete so a tidied link cannot orphan a response.</text>
