<text text-anchor="start" x="241.9" y="-209.4" font-family="Arial" font-size="14.00"> The subject, when an existing client fills a waiver. Nullable because phase 2 adds prospect_intake_id for people who have no client record yet, and widens form_responses_subject to &quot;exactly one subject&quot;. Until then the check requires a client.</text>
