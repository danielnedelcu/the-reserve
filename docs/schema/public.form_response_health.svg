<text text-anchor="start" x="117.01" y="-565.6" font-family="Arial" font-size="14.00"> The question as it was asked, snapshotted. An answer of &quot;yes&quot; is meaningless without the question, and the version&#39;s field list can be superseded by a later publish.</text>
