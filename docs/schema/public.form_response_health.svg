<text text-anchor="start" x="1498.87" y="-700.4" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="53.2" y="-686" font-family="Arial" font-size="14.00" fill="#333333">Answers to fields the form version marks sensitive — health history and the like. A SEPARATE TABLE rather than a column on form_responses because RLS is row&#45;level and cannot hide a column: as rows, the database itself refuses them to anyone without clients.notes.health.view, so a route that forgets to filter returns nothing rather than leaking PHI. Same tier as client_notes.kind=&#39;health&#39;, which is where these are promoted on enrollment.</text>
