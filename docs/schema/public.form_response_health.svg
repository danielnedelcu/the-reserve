<text text-anchor="start" x="235.67" y="-209.4" font-family="Arial" font-size="14.00" fill="#666666">[text]</text>
<text text-anchor="start" x="266.02" y="-209.4" font-family="Arial" font-size="14.00"> Physical snapshot of the consent copy this person actually agreed to, readable without joining the version. Same discipline as the card&#45;consent policy_text snapshot: the legal record must not depend on a lookup years later.</text>
<polygon fill="none" stroke="black" points="145.4,-166.4 145.4,-197.2 2705.15,-197.2 2705.15,-166.4 145.4,-166.4"/>
