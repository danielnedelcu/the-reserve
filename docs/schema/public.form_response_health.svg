<text text-anchor="start" x="207.65" y="-271" font-family="Arial" font-size="14.00" fill="#666666">[uuid]</text>
<text text-anchor="start" x="241.9" y="-271" font-family="Arial" font-size="14.00"> The subject, when an existing client fills a waiver. Nullable because phase 2 adds prospect_intake_id for people who have no client record yet, and widens form_responses_subject to &quot;exactly one subject&quot;. Until then the check requires a client.</text>
<polygon fill="none" stroke="black" points="145.4,-228 145.4,-258.8 2705.15,-258.8 2705.15,-228 145.4,-228"/>
