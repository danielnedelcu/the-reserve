<text text-anchor="start" x="1444.76" y="-405.8" font-family="Arial" font-size="14.00">    </text>
<text text-anchor="start" x="1475.88" y="-405.8" font-family="Arial" font-size="14.00" fill="#666666">[BASE TABLE]</text>
<text text-anchor="start" x="152.4" y="-391.4" font-family="Arial" font-size="14.00" fill="#333333">One filled&#45;in form. answers holds ONLY the non&#45;sensitive answers; anything the version marks sensitive is in form_response_health, behind clients.notes.health.view. No authenticated INSERT policy exists on purpose: a submission must be validated against its version&#39;s field list, Postgres cannot check jsonb shape, so writes go through a server route under the service role and the validator is the enforcement.</text>
<polygon fill="none" stroke="black" points="145.4,-351.2 145.4,-382 2705.15,-382 2705.15,-351.2 145.4,-351.2"/>
