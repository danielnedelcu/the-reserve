<text text-anchor="start" x="266.02" y="-147.8" font-family="Arial" font-size="14.00"> Physical snapshot of the consent copy this person actually agreed to, readable without joining the version. Same discipline as the card&#45;consent policy_text snapshot: the legal record must not depend on a lookup years later.</text>
