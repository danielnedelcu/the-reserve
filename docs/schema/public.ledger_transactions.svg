<text text-anchor="start" x="53.2" y="-640.8" font-family="Arial" font-size="14.00" fill="#333333">One row per transaction with the header figures (discount_cents and tax_cents are kept on the header; a refund&#39;s are negative) and the transaction&#39;s own location&#39;s calendar: local_day / local_week (Sunday start) / local_month. Counts and averages come from here (non&#45;refund rows); line categories from ledger_lines. SECURITY INVOKER: the ledger&#39;s RLS applies as the caller.</text>
