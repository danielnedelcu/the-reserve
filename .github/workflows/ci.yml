# The gate. A change that breaks the typecheck, a unit test, or lint
# cannot merge: main requires the "typecheck + tests" and "lint" checks.
# Lint was advisory until the sweep took it to zero (PR #1); it is
# blocking from then on — gating on a red suite is how the test
# graveyard happened, so it was never gated while red.
#
# The database job (docs/testing-design.md, PR A) runs the verify:*
# harnesses against a LOCAL Supabase stack started in the runner and
# rebuilt from supabase/migrations/ — never the hosted project, and with
# no secret: the stack's keys are the CLI's fixed local ones, read at run
# time by scripts/_env.mjs, and SUPABASE_LOCAL=true makes every harness
# refuse anything that is not localhost.
#
# The e2e job (docs/testing-design.md, PR B) goes one step further: the
# same stack, the app BUILT into its own folders and started on the e2e
# port by scripts/ci-start-app.mjs, verify:leads against it (the one
# harness that exercises a public endpoint over HTTP), then the Playwright
# journeys in Chromium. Traces and screenshots of a failure are kept for a
# week. Not a required check yet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Type-check the end-to-end tests
        run: npx tsc -p e2e

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  database:
    name: database (local stack + harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The CLI is a root devDependency, so `npx supabase` is the same
      # pinned version here as on a laptop. postgrest and gotrue stay:
      # the harnesses query through PostgREST and sign test staff in
      # through GoTrue. Everything else the harnesses never touch is
      # left out so the stack starts faster.
      - name: Start the local Supabase stack
        run: npx supabase start --ignore-health-check -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Rebuild the database from the migrations
        run: npx supabase db reset --local
      # The migrations make ask_readonly a login role with its read-only
      # and timeout settings, and deliberately set no password (on the
      # hosted project it is set by hand). A throwaway one for this run.
      - name: Give ask_readonly a password for this run
        run: npx supabase db query --local "alter role ask_readonly with password 'ci-test-password'"
      # `status -o env` quotes every value; GITHUB_ENV takes a line
      # literally, so the quotes would become part of the value and the
      # URL would fail to parse (the first run on a runner, 2026-10-05).
      - name: Export the local stack's URL and keys
        run: npx supabase status -o env | sed -E 's/^([A-Z_0-9]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Verify harnesses against the local stack
        run: npm run verify:forms && npm run verify:ask && npm run verify:messages && npm run verify:tables
        env:
          SUPABASE_LOCAL: "true"
          ASK_READONLY_PASSWORD: ci-test-password
          # The forms harness checks the pepper is configured and uses it to
          # hash a test IP; any 32+ hex string will do on a throwaway stack.
          FORM_IP_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  e2e:
    name: e2e (built app + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start the local Supabase stack
        run: npx supabase start --ignore-health-check -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Rebuild the database from the migrations
        run: npx supabase db reset --local
      - name: Export the local stack's URL and keys
        run: npx supabase status -o env | sed -E 's/^([A-Z_0-9]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Build the app into its own folders
        run: npm run build:check
      # Starts the built server on 3300 against the stack and writes the
      # values a harness must share with the app (the seeded organisation,
      # the allowed origin, the pepper) to node_modules/.cache/ci-app.env.
      - name: Start the app
        run: npm run app:start && cat node_modules/.cache/ci-app.env >> "$GITHUB_ENV"
        env:
          SUPABASE_LOCAL: "true"
      - name: verify:leads against the running app
        run: npm run verify:leads -- "$E2E_BASE_URL"
      - name: verify:ledger against the running app (local only; writes ledger rows)
        run: npm run verify:ledger
        env:
          SUPABASE_LOCAL: "true"
      - name: Playwright journeys
        run: npm run test:e2e
        env:
          SUPABASE_LOCAL: "true"
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - name: App server log
        if: failure()
        run: tail -n 200 apps/reserve/.output-check/server.log 2>/dev/null || echo "No log."
      - name: Stop the app
        if: always()
        run: npm run app:stop
